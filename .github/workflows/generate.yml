name: Daily Autopublish
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install requests feedparser python-slugify

      - name: Generate & publish post
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - << 'PY'
          import feedparser, random, requests, datetime, pathlib, os, textwrap
          from slugify import slugify

          today    = datetime.date.today()
          feed_url = f'https://en.wikipedia.org/api/rest_v1/feed/featured/{today:%Y/%m/%d}'
          entries  = feedparser.parse(feed_url).entries
          titles   = [e['title'] for e in entries if 'title' in e]

          if not titles:  # feed empty fallback
              titles = ['Latest Breakthroughs in Artificial Intelligence']

          subject  = random.choice(titles)

          # ▸ Try HuggingFace first
          prompt = f"Write an upbeat 900-word blog post on \"{subject}\" with 5 H2s and a punchy conclusion."
          headers = {'Content-Type': 'application/json'}
          hf_token = os.getenv('HF_TOKEN', '').strip()
          if hf_token:
              headers['Authorization'] = f'Bearer {hf_token}'

          generated = ''
          try:
              resp = requests.post(
                  'https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2',
                  headers=headers,
                  json={'inputs': prompt, 'options': {'wait_for_model': False}},
                  timeout=90
              )
              if resp.status_code == 200:
                  data = resp.json()
                  # HF returns list[dict] when successful
                  if isinstance(data, list) and data and 'generated_text' in data[0]:
                      generated = data[0]['generated_text']
          except Exception as e:
              pass  # ignore & fall back

          # ▸ Fallback: Wikipedia summary + filler
          if not generated:
              summary = ''
              try:
                  w = requests.get(f'https://en.wikipedia.org/api/rest_v1/page/summary/{subject}', timeout=30)
                  if w.status_code == 200:
                      summary = w.json().get('extract', '')
              except Exception:
                  pass
              generated = textwrap.dedent(f"""
                  ## Quick Take

                  {summary or 'The topic is generating a lot of buzz this year.'}

                  ## Why it matters

                  • Search interest is spiking 🚀  
                  • Investors and researchers are piling in  
                  • Expect rapid evolution over the next 12 months

                  ## Final Thoughts

                  Auto-generated by an unstoppable content robot. Stay tuned.
              """)

          # ▸ Save markdown
          date_str = today.strftime('%Y-%m-%d')
          slug     = slugify(subject)
          md_path  = pathlib.Path(f'_posts/{date_str}-{slug}.md')
          md_path.parent.mkdir(parents=True, exist_ok=True)
          front = f"---\\nlayout: post\\ntitle: \"{subject}\"\\ndate: {date_str} 00:00:00 +0000\\n---\\n\\n"
          md_path.write_text(front + generated)
          print(f"Wrote {md_path}")
          PY

      - name: Commit & push
        run: |
          git config user.name 'APIE-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add _posts/*.md || true
          git commit -m "Autopost" || echo "Nothing new to commit"
          git push
