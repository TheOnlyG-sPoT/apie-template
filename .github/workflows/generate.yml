name: Daily Autopublish
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install requests feedparser python-slugify

      - name: Generate & publish post
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - << 'PY'
           import feedparser, random, requests, datetime, pathlib, os
          from slugify import slugify

          today = datetime.date.today()
          feed_url = f'https://en.wikipedia.org/api/rest_v1/feed/featured/{today:%Y/%m/%d}'
          entries  = feedparser.parse(feed_url).entries
          titles   = [e['title'] for e in entries if 'title' in e]

          # ▸ Fallback topic if feed is empty
          if not titles:
              titles = ['Breakthroughs in Artificial-Intelligence 2025']

          subject  = random.choice(titles)

          # 2️⃣  Ask HuggingFace LLM for a 900‑word SEO post
          prompt = f"Write a 900‑word SEO blog post about {subject}."
          headers = {
              'Authorization': f"Bearer {os.environ['HF_TOKEN']}",
              'Content-Type': 'application/json'
          }
          api = 'https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2'
          text = requests.post(api, headers=headers, json={'inputs': prompt}).json()[0]['generated_text']

          # 3️⃣  Save as Jekyll Markdown
          today = datetime.datetime.utcnow().strftime('%Y-%m-%d')
          slug = slugify(subject)
          path = pathlib.Path(f'_posts/{today}-{slug}.md')
          path.parent.mkdir(parents=True, exist_ok=True)
          front = f"---\nlayout: post\ntitle: {subject}\ndate: {today} 00:00:00 +0000\n---\n\n"
          path.write_text(front + text)
          PY

      - name: Commit & push
        run: |
          git config user.name 'APIE-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add _posts/*.md || true
          git commit -m "Autopost" || echo "Nothing new to commit"
          git push
